services:
  frontend:
    build:
      context: ./frontend
      args:
        - DATABASE_URL=postgresql://streamharbor:supersecretpassword@db:5432/streamharbor_db
        - NEXT_PUBLIC_BACKEND_URL=https://api.streamharbor.me
    ports:
      - "3000:3000"
    command: node server.js
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://streamharbor:supersecretpassword@db:5432/streamharbor_db
      - NEXTAUTH_URL=https://streamharbor.me
      - NEXT_PUBLIC_BACKEND_URL=https://api.streamharbor.me
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    command: node dist/server.js
    env_file:
      - .env
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      queue:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Keep time sync volumes
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    env_file:
      - .env
    environment:
      - MINIO_SERVER_URL=https://minio.streamharbor.me
      - MINIO_BROWSER_REDIRECT_URL=https://minio.streamharbor.me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      # Mount the script folder
      - ./minio_bootstrap:/bootstrap
      # Mount the config files to a separate path inside container
      - ./cors.xml:/bootstrap_config/cors.xml:ro
      - ./policy.json:/bootstrap_config/policy.json:ro
    # Run script, then start server (single disk for local dev)
    entrypoint: |
      sh -c "
        chmod +x /bootstrap/set_policies.sh && /bootstrap/set_policies.sh &
        exec /usr/bin/docker-entrypoint.sh server /data --console-address :9001
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  queue:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes: # Keep time sync volumes
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./worker
    command: node dist/processor.js
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      queue:
        condition: service_healthy

volumes:
  pg_data:
  minio_data: