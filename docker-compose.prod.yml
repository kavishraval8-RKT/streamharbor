# Production overrides for StreamHarbor
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  frontend:
    build:
      context: ./frontend
      args:
        - DATABASE_URL=postgresql://streamharbor:supersecretpassword@db:5432/streamharbor_db
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://streamharbor:supersecretpassword@db:5432/streamharbor_db
    # Override dev command with production CMD from Dockerfile
    command: node server.js
    volumes: []
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
    # Override dev command with production CMD from Dockerfile
    command: node dist/server.js
    volumes: []
  worker:
    build:
      context: ./worker
    environment:
      - NODE_ENV=production
    # Override dev command if any
    command: node dist/processor.js
    volumes: []
  minio:
    environment:
      - MINIO_SERVER_URL=https://minio.streamharbor.me
      - MINIO_BROWSER_REDIRECT_URL=https://minio.streamharbor.me
